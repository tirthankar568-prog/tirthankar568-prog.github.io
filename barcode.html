<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ID Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 420px;
      margin: 6px 0 12px 0;
      text-align: center;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .subtitle {
      font-size: 0.72rem;
      color: #38bdf8;
      margin-top: 3px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 600;
    }
    #scanner-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 320px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #reader {
      width: 100%;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 14px;
    }

    /* Reticle */
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 48%;
      border: 2px solid rgba(56, 189, 248, 0.7);
      border-radius: 10px;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.45);
    }
    .guide-line {
      position: absolute;
      top: 50%;
      left: 6%;
      right: 6%;
      height: 2px;
      background: #ef4444;
      opacity: 0.8;
      box-shadow: 0 0 4px #ef4444;
    }

    /* Error Message Box inside Scanner Wrapper */
    #errorBox {
      padding: 24px 20px;
      text-align: center;
      background: #1e293b;
      border-radius: 12px;
      margin: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .error-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ef4444;
    }
    .error-desc {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.4;
      word-break: break-word;
    }
    .retry-btn {
      padding: 9px 16px;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.82rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }
    .retry-btn:active {
      background-color: #0ea5e9;
    }

    /* Floating Result Overlay */
    #resultOverlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      z-index: 20;
    }
    .overlay-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .mono-text {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      word-break: break-all;
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .response-box {
      font-family: monospace;
      font-size: 0.82rem;
      color: #a7f3d0;
      background: #022c22;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #065f46;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 140px;
      overflow-y: auto;
    }
    .badge-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .badge-sending { background: #eab308; color: #000; }
    .badge-done { background: #22c55e; color: #fff; }
    .badge-fail { background: #ef4444; color: #fff; }

    .btn-action {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #38bdf8;
      color: #0f172a;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      margin-top: 14px;
    }
    .btn-action:active {
      background-color: #0ea5e9;
    }
    .hidden {
      display: none !important;
    }

    /* History Card */
    .card {
      width: 100%;
      max-width: 420px;
      margin-top: 14px;
      padding: 14px 16px;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .log-count {
      background: #334155;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: 6px;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .clear-btn:hover {
      color: #ef4444;
    }
    .history-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    .history-item {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-tag {
      font-family: monospace;
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .history-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .history-time {
      font-size: 0.7rem;
      color: #64748b;
    }
    .history-resp {
      font-family: monospace;
      font-size: 0.75rem;
      color: #cbd5e1;
      background: #1e293b;
      padding: 6px 8px;
      border-radius: 4px;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 60px;
      overflow-y: auto;
    }
    .history-empty {
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
      padding: 18px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>ID Card Scanner</h1>
    <div class="subtitle">Code 128 Dedicated Reader</div>
  </header>

  <div id="scanner-wrapper">
    <div id="reader"></div>
    <div class="scan-guide" id="scanGuide">
      <div class="guide-line"></div>
    </div>

    <!-- Error message fallback display -->
    <div id="errorBox" class="hidden">
      <div class="error-title" id="errorTitle">Camera Access Required</div>
      <div class="error-desc" id="errorDesc"></div>
      <button class="retry-btn" id="retryBtn">Try Again</button>
    </div>

    <div id="resultOverlay" class="hidden">
      <div class="overlay-body">
        <div>
          <div class="card-label">Scanned ID / Code 128</div>
          <div id="tagDisplay" class="mono-text"></div>
        </div>

        <div>
          <div class="card-label">Server Response</div>
          <div id="responseDisplay" class="response-box">Waiting for Apps Script reply...</div>
        </div>

        <div class="badge-bar">
          <span class="card-label" style="margin-bottom: 0;">Status</span>
          <span id="badge" class="badge badge-sending">SENDING</span>
        </div>
      </div>

      <button id="scanAgainBtn" class="btn-action">Scan Next ID</button>
    </div>
  </div>

  <div class="card" id="historyCard">
    <div class="card-header-row">
      <div>
        <span class="card-label" style="margin-bottom: 0;">Recent Scans Log</span>
        <span id="logCount" class="log-count">0</span>
      </div>
      <button class="clear-btn" id="clearBtn">Clear Log</button>
    </div>
    <ul id="historyList" class="history-list">
      <li class="history-empty">No recent scans logged</li>
    </ul>
  </div>

  <script>
    const SCRIPT_BASE = "https://script.google.com/macros/s/AKfycbwCBubJiXwKVKoLAltV1VEvHcfTT0r0FbEOAyK6b6y_pHKf8HAyRQ2GnfjDqr9Kgl_g/exec";

    const scannerWrapper = document.getElementById("scanner-wrapper");
    const scanGuide = document.getElementById("scanGuide");
    const errorBox = document.getElementById("errorBox");
    const errorTitle = document.getElementById("errorTitle");
    const errorDesc = document.getElementById("errorDesc");
    const retryBtn = document.getElementById("retryBtn");

    const resultOverlay = document.getElementById("resultOverlay");
    const tagDisplay = document.getElementById("tagDisplay");
    const responseDisplay = document.getElementById("responseDisplay");
    const badge = document.getElementById("badge");
    const scanAgainBtn = document.getElementById("scanAgainBtn");
    const historyList = document.getElementById("historyList");
    const clearBtn = document.getElementById("clearBtn");
    const logCount = document.getElementById("logCount");

    let scanner = null;
    let isCameraActive = false;
    let isPaused = false;
    let scanLogs = [];

    function renderLogs() {
      logCount.innerText = scanLogs.length;

      if (scanLogs.length === 0) {
        historyList.innerHTML = `<li class="history-empty">No recent scans logged</li>`;
        return;
      }

      historyList.innerHTML = scanLogs.map(item => `
        <li class="history-item">
          <div class="history-header">
            <span class="history-tag" title="${item.tagId}">${item.tagId}</span>
            <div class="history-meta">
              <span class="history-time">${item.time}</span>
              <span class="badge badge-${item.badge}">${item.statusText}</span>
            </div>
          </div>
          <div class="history-resp">${item.response}</div>
        </li>
      `).join('');
    }

    function addLogEntry(tagId) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      
      const newEntry = {
        id: Date.now(),
        tagId: tagId,
        time: timeStr,
        badge: "sending",
        statusText: "SENDING",
        response: "Awaiting reply..."
      };

      scanLogs.unshift(newEntry);
      if (scanLogs.length > 50) scanLogs.pop();
      renderLogs();
      return newEntry.id;
    }

    function updateLogEntry(entryId, responseText, isSuccess) {
      const entry = scanLogs.find(e => e.id === entryId);
      if (entry) {
        entry.badge = isSuccess ? "done" : "fail";
        entry.statusText = isSuccess ? "SUCCESS" : "ERROR";
        entry.response = responseText;
        renderLogs();
      }
    }

    clearBtn.addEventListener("click", () => {
      scanLogs = [];
      renderLogs();
    });

    function triggerScanFeedback() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}

      if ("vibrate" in navigator) {
        navigator.vibrate(80);
      }
    }

    function setStatus(badgeType, badgeText) {
      badge.className = `badge badge-${badgeType}`;
      badge.innerText = badgeText;
    }

    function showCameraError(err) {
      scanGuide.classList.add("hidden");
      errorBox.classList.remove("hidden");

      // Verify protocol
      const isSecure = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      
      if (!isSecure) {
        errorTitle.innerText = "Insecure Origin (HTTPS Required)";
        errorDesc.innerHTML = `Camera access is blocked because this page is not served over <b>HTTPS</b> or <b>localhost</b>.<br><br>Please run on a local development server or host via HTTPS.`;
        return;
      }

      const errString = String(err && (err.name || err.message) ? (err.name + ": " + err.message) : err);

      if (errString.includes("NotAllowedError") || errString.includes("Permission denied")) {
        errorTitle.innerText = "Permission Denied";
        errorDesc.innerHTML = `Camera permission was blocked.<br><br>Tap the <b>site/lock icon</b> in your browser's address bar &rarr; <b>Site settings</b> &rarr; Allow <b>Camera</b>, then tap Try Again.`;
      } else if (errString.includes("NotFoundError") || errString.includes("DevicesNotFoundError")) {
        errorTitle.innerText = "No Camera Found";
        errorDesc.innerText = "No suitable rear camera was detected on this device.";
      } else if (errString.includes("NotReadableError") || errString.includes("TrackStartError")) {
        errorTitle.innerText = "Camera Is In Use";
        errorDesc.innerText = "Another application or browser tab is currently using the camera. Please close other camera tabs and retry.";
      } else {
        errorTitle.innerText = "Camera Initialization Failed";
        errorDesc.innerHTML = `Unable to start video feed: <br><code style="color:#f87171; font-size:0.75rem;">${errString}</code>`;
      }
    }

    async function initCamera() {
      errorBox.classList.add("hidden");
      scanGuide.classList.remove("hidden");

      // Re-create Html5Qrcode instance
      if (!scanner) {
        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39
          ],
          verbose: false,
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          }
        });
      }

      const scannerConfig = {
        fps: 25,
        disableFlip: true
      };

      // Tier 1: Try flexible rear camera constraints
      try {
        await scanner.start(
          {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920, min: 640 },
            height: { ideal: 1080, min: 480 }
          },
          scannerConfig,
          onScanSuccess,
          () => {}
        );
        isCameraActive = true;
        isPaused = false;
        return;
      } catch (tier1Err) {
        console.warn("Tier 1 constraint failed, trying Tier 2 fallback:", tier1Err);
      }

      // Tier 2: Try basic facingMode environment
      try {
        await scanner.start(
          { facingMode: "environment" },
          scannerConfig,
          onScanSuccess,
          () => {}
        );
        isCameraActive = true;
        isPaused = false;
        return;
      } catch (tier2Err) {
        console.warn("Tier 2 fallback failed, trying Tier 3 device enumeration:", tier2Err);
      }

      // Tier 3: Enumerate video devices and select the last one (usually back camera)
      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length > 0) {
          const selectedCam = devices[devices.length - 1];
          await scanner.start(
            selectedCam.id,
            scannerConfig,
            onScanSuccess,
            () => {}
          );
          isCameraActive = true;
          isPaused = false;
          return;
        } else {
          throw new Error("No video devices discovered.");
        }
      } catch (tier3Err) {
        showCameraError(tier3Err);
      }
    }

    retryBtn.addEventListener("click", () => {
      initCamera();
    });

    function resumeScanning() {
      resultOverlay.classList.add("hidden");

      if (isCameraActive && isPaused) {
        try {
          scanner.resume();
          isPaused = false;
        } catch (e) {
          console.warn("Resume error:", e);
        }
      }
    }

    let activeLogEntryId = null;

    window.handleAppsScriptResponse = function(data) {
      setStatus("done", "SUCCESS");
      const respString = typeof data === "object" ? JSON.stringify(data, null, 2) : String(data);
      responseDisplay.innerText = respString;

      if (activeLogEntryId) {
        updateLogEntry(activeLogEntryId, respString, true);
        activeLogEntryId = null;
      }
    };

    function sendViaJSONP(tagId) {
      const oldScript = document.getElementById("gas-jsonp-script");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "gas-jsonp-script";
      script.src = `${SCRIPT_BASE}?tagId=${encodeURIComponent(tagId)}&callback=handleAppsScriptResponse`;
      
      script.onerror = function() {
        setStatus("fail", "ERROR");
        const errMsg = "Error contacting Google Apps Script.";
        responseDisplay.innerText = errMsg;
        if (activeLogEntryId) {
          updateLogEntry(activeLogEntryId, errMsg, false);
          activeLogEntryId = null;
        }
      };

      document.body.appendChild(script);
    }

    function onScanSuccess(decodedText) {
      if (isPaused) return;

      try {
        scanner.pause(true);
        isPaused = true;
      } catch (e) {}

      triggerScanFeedback();
      const cleanTag = decodedText.trim();

      tagDisplay.innerText = cleanTag;
      responseDisplay.innerText = "Querying Google Apps Script...";
      setStatus("sending", "SENDING");
      resultOverlay.classList.remove("hidden");

      activeLogEntryId = addLogEntry(cleanTag);
      sendViaJSONP(cleanTag);
    }

    scanAgainBtn.addEventListener("click", () => {
      resumeScanning();
    });

    // Run on load
    initCamera();
  </script>
</body>
</html>
