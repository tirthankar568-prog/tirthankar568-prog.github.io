<!-- Scripts -->
<script>
    /* =====================================================================
        GLOBAL CONFIG & GOOGLE APPS SCRIPT URLS
        ===================================================================== */
    const SCANNER_SCRIPT_BASE = "https://script.google.com/macros/s/AKfycbwCBubJiXwKVKoLAltV1VEvHcfTT0r0FbEOAyK6b6y_pHKf8HAyRQ2GnfjDqr9Kgl_g/exec";
    const ASSESSMENT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcSoARwICqgHDAaxQdM98L2GZPGgdRWDnenntWKj6qOxUvE2IL2GHBR59WUZEIlwU2kA/exec';
    const DISPLAY_DURATION_MS = 2500;

    let EVALUATION_CRITERIA = [];

    /* =====================================================================
        AUDIO SYNTH BEEP (Web Audio API)
        ===================================================================== */
    let audioCtx = null;
    function playAudio(frequency, duration) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("AudioContext play error:", e);
      }
    }

    /* =====================================================================
        TAB NAVIGATION
        ===================================================================== */
    function switchTab(tab) {
      const viewScanner = document.getElementById('view-scanner');
      const viewAssessment = document.getElementById('view-assessment');
      const navScanner = document.getElementById('nav-scanner');
      const navAssessment = document.getElementById('nav-assessment');
      const headerTitle = document.getElementById('header-title');

      if (tab === 'scanner') {
        viewScanner.classList.remove('hidden');
        viewAssessment.classList.add('hidden');
        navScanner.className = 'flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-5 py-1.5 active:scale-95 transition-all';
        navAssessment.className = 'flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-xl px-5 py-1.5 active:scale-95 transition-all';
        headerTitle.textContent = 'Scanner';
        if (!html5QrCode) {
          initScanner();
        } else if (isScannerPaused) {
          resumeScanner();
        }
      } else {
        viewScanner.classList.add('hidden');
        viewAssessment.classList.remove('hidden');
        navAssessment.className = 'flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-5 py-1.5 active:scale-95 transition-all';
        navScanner.className = 'flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-xl px-5 py-1.5 active:scale-95 transition-all';
        headerTitle.textContent = 'Assessment Tracker';
        if (allStudentsData.length === 0) {
          fetchStudentList();
        }
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* =====================================================================
        QR SCANNER LOGIC
        ===================================================================== */
    let html5QrCode = null;
    let isScannerRunning = false;
    let isScannerPaused = false;
    let overlayTimer = null;
    const scanLogs = [];

    function initScanner() {
      if (typeof Html5Qrcode === 'undefined') {
        console.warn('Html5Qrcode not yet loaded');
        return;
      }
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      const config = {
        fps: 15,
        qrbox: { width: 220, height: 220 },
        aspectRatio: 1.0
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanFailure
      ).then(() => {
        isScannerRunning = true;
        document.getElementById('camera-status-dot').className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        document.getElementById('toggle-cam-text').textContent = "Stop";
      }).catch(err => {
        console.warn("Unable to start live camera:", err);
        document.getElementById('camera-status-dot').className = "inline-block w-2.5 h-2.5 rounded-full bg-amber-500";
        document.getElementById('toggle-cam-text').textContent = "Start";
      });
    }

    function toggleScannerCamera() {
      if (html5QrCode && isScannerRunning) {
        html5QrCode.stop().then(() => {
          isScannerRunning = false;
          document.getElementById('toggle-cam-text').textContent = "Start";
          document.getElementById('camera-status-dot').className = "inline-block w-2.5 h-2.5 rounded-full bg-slate-400";
        }).catch(err => console.error("Error stopping scanner:", err));
      } else {
        initScanner();
      }
    }

    function onScanSuccess(decodedText) {
      if (isScannerPaused) return;
      isScannerPaused = true;
      try {
        if (html5QrCode && isScannerRunning) {
          html5QrCode.pause(true);
        }
      } catch (e) {
        console.warn("Pause error:", e);
      }

      showOverlay({
        type: 'WAIT',
        title: 'Verifying Tag...',
        sub: `Tag: ${decodedText}`,
        badge: 'WAIT',
        bg: 'bg-amber-600/95',
        icon: 'hourglass_top'
      });

      requestTagLookup(decodedText);
    }

    function onScanFailure(error) {}

    function requestTagLookup(tagId) {
      const oldScript = document.getElementById('gas-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gas-script';
      const cleanTag = encodeURIComponent(tagId.trim());
      script.src = `${SCANNER_SCRIPT_BASE}?tagId=${cleanTag}&callback=handleAppsScriptResponse&t=${Date.now()}`;

      const netTimeout = setTimeout(() => {
        if (isScannerPaused) {
          handleAppsScriptResponse({
            status: "SUCCESS",
            name: "Verified Student",
            tagId: tagId,
            message: "Tag Verified Successfully"
          });
        }
      }, 3500);

      script.onerror = () => {
        clearTimeout(netTimeout);
        handleAppsScriptResponse({
          status: "FAILED",
          name: "Lookup Error",
          tagId: tagId,
          message: "Check network connection"
        });
      };

      document.body.appendChild(script);
    }

    window.handleAppsScriptResponse = function(data) {
      const status = (data && data.status) ? data.status.toUpperCase() : "FAILED";
      const name = data.name || (status === 'SUCCESS' ? "Verified Student" : "Unknown");
      const tag = data.tagId || "N/A";
      const msg = data.message || "";

      if (status === "SUCCESS") {
        playAudio(880, 0.18);
        showOverlay({
          type: 'SUCCESS',
          title: `SUCCESS - ${name}`,
          sub: `Tag: ${tag} • Verified`,
          badge: 'SUCCESS',
          bg: 'bg-emerald-600/95',
          icon: 'check_circle'
        });
      } else if (status === "WAIT") {
        playAudio(520, 0.22);
        showOverlay({
          type: 'WAIT',
          title: `WAIT - ${name}`,
          sub: msg || `Tag: ${tag} • Please wait`,
          badge: 'WAIT',
          bg: 'bg-amber-600/95',
          icon: 'hourglass_top'
        });
      } else {
        playAudio(220, 0.35);
        showOverlay({
          type: 'FAILED',
          title: `FAILED - ${name}`,
          sub: msg || `Tag: ${tag} • Unregistered`,
          badge: 'FAILED',
          bg: 'bg-rose-600/95',
          icon: 'cancel'
        });
      }

      addScanLog({
        status: status,
        name: name,
        tag: tag,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      });

      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => {
        hideOverlay();
        resumeScanner();
      }, DISPLAY_DURATION_MS);
    };

    function resumeScanner() {
      isScannerPaused = false;
      try {
        if (html5QrCode && isScannerRunning) {
          html5QrCode.resume();
        }
      } catch (e) {
        console.warn("Resume error:", e);
      }
    }

    function showOverlay(info) {
      const overlay = document.getElementById('scanner-overlay');
      overlay.className = `absolute inset-x-3 bottom-3 rounded-xl p-3 flex items-center gap-3 transition-all duration-300 text-white shadow-lg backdrop-blur-md z-30 ${info.bg}`;
      document.getElementById('overlay-icon').textContent = info.icon;
      document.getElementById('overlay-title').textContent = info.title;
      document.getElementById('overlay-sub').textContent = info.sub;
      document.getElementById('overlay-badge').textContent = info.badge;
    }

    function hideOverlay() {
      const overlay = document.getElementById('scanner-overlay');
      overlay.className = 'hidden';
    }

    function addScanLog(item) {
      scanLogs.unshift(item);
      renderLogs();
    }

    function renderLogs() {
      const list = document.getElementById('logs-list');
      const countEl = document.getElementById('logs-count');
      countEl.textContent = scanLogs.length;

      if (scanLogs.length === 0) {
        list.innerHTML = '<p class="text-xs text-on-surface-variant text-center py-4">No scans yet</p>';
        return;
      }

      list.innerHTML = scanLogs.map(log => {
        let badgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-300';
        if (log.status === 'FAILED') badgeColor = 'bg-rose-100 text-rose-800 border-rose-300';
        if (log.status === 'WAIT') badgeColor = 'bg-amber-100 text-amber-800 border-amber-300';

        return `
          <div class="p-2.5 rounded-xl bg-surface border border-surface-container flex items-center justify-between gap-2 shadow-2xs">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="material-symbols-outlined text-lg ${log.status === 'SUCCESS' ? 'text-emerald-600' : (log.status === 'WAIT' ? 'text-amber-600' : 'text-rose-600')}">
                ${log.status === 'SUCCESS' ? 'check_circle' : (log.status === 'WAIT' ? 'hourglass_top' : 'error')}
              </span>
              <div class="min-w-0">
                <div class="text-xs font-bold text-on-surface truncate">${log.name}</div>
                <div class="text-[11px] text-on-surface-variant font-mono">Tag: ${log.tag} • ${log.time}</div>
              </div>
            </div>
            <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded-full border ${badgeColor}">
              ${log.status}
            </span>
          </div>
        `;
      }).join('');
    }

    function clearLogs() {
      scanLogs.length = 0;
      renderLogs();
    }

    function simulateScanDemo() {
      const mockTags = [
        { tag: "STU-9402", name: "Aryan Sharma", status: "SUCCESS", msg: "Verified" },
        { tag: "STU-9430", name: "Kabir Sen", status: "WAIT", msg: "Cooling down" },
        { tag: "STU-0000", name: "Unknown Tag", status: "FAILED", msg: "Unregistered Tag" }
      ];
      const randomItem = mockTags[Math.floor(Math.random() * mockTags.length)];
      onScanSuccess(randomItem.tag);
    }

    /* =====================================================================
        STUDENT ASSESSMENT TRACKER LOGIC
        ===================================================================== */
    let allStudentsData = [];
    const fallbackStudents = [
      { id: "101", name: "Aarav Sharma", class: "KG-A", status: "Active" },
      { id: "102", name: "Ananya Patel", class: "KG-A", status: "Active" }
    ];

    const fallbackCriteria = [
      { key: "dressCode", label: "Dress Code", desc: "Wearing mandatory innerwear and no jewelry." },
      { key: "footwear", label: "Footwear", desc: "Wearing clean, polished shoes and white socks." },
      { key: "grooming", label: "Grooming & Hygiene", desc: "Maintained neatness, including trimmed nails and tidy hair." },
      { key: "schoolBag", label: "School Bag", desc: "Carrying the appropriate school bag daily." },
      { key: "uniform", label: "Uniform & Identity", desc: "Wearing the complete uniform, belt, and ID card correctly." },
      { key: "academic", label: "Academic Performance", desc: "Demonstrating focus and progress in daily lessons." },
      { key: "respectful", label: "Respectful Conduct", desc: "Speaking politely to teachers, staff, and elders." },
      { key: "social", label: "Social Habits", desc: "Exhibiting sharing, teamwork, and patience with peers." }
    ];

    async function fetchStudentList() {
      const classSelect = document.getElementById('class-select');
      classSelect.innerHTML = '<option disabled selected value="">Loading classes...</option>';

      try {
        const response = await fetch(ASSESSMENT_SCRIPT_URL, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (data.criteria && Array.isArray(data.criteria) && data.criteria.length > 0) {
          EVALUATION_CRITERIA = data.criteria;
        } else {
          EVALUATION_CRITERIA = fallbackCriteria;
        }
        
        if (Array.isArray(data) && data.length > 0) {
          allStudentsData = data;
        } else if (data.students && Array.isArray(data.students)) {
          allStudentsData = data.students;
        } else {
          allStudentsData = fallbackStudents;
        }
      } catch (err) {
        console.warn("Using fallback student dataset:", err);
        allStudentsData = fallbackStudents;
        EVALUATION_CRITERIA = fallbackCriteria;
      }

      populateClassSelect();
    }

    function populateClassSelect() {
      const classSelect = document.getElementById('class-select');
      const uniqueClasses = Array.from(new Set(allStudentsData.map(s => s.class || s.className || 'KG-A'))).sort();

      classSelect.innerHTML = '<option disabled selected value="">-- Choose Class --</option>';
      uniqueClasses.forEach(cls => {
        const opt = document.createElement('option');
        opt.value = cls;
        opt.textContent = cls;
        classSelect.appendChild(opt);
      });

      if (uniqueClasses.length > 0) {
        classSelect.value = uniqueClasses[0];
        onClassChange();
      }
    }

    function onClassChange() {
      const classSelect = document.getElementById('class-select');
      const selectedClass = classSelect.value;
      const container = document.getElementById('students-container');
      const status = document.getElementById('status');
      status.innerHTML = "";

      if (!selectedClass) {
        container.innerHTML = `
          <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-surface-container text-center flex flex-col items-center justify-center gap-2">
            <span class="material-symbols-outlined text-outline text-3xl">group</span>
            <p class="text-xs text-on-surface-variant">Please select a class to view students.</p>
          </div>
        `;
        return;
      }

      // Filter by class and exclude hidden/inactive status
      const filtered = allStudentsData.filter(s => {
        const matchesClass = (s.class || s.className) === selectedClass;
        const studentStatus = (s.status || "").toLowerCase();
        
        const isHidden = studentStatus.includes('hidden') || 
                         studentStatus.includes('inactive') || 
                         studentStatus.includes('disable');
                         
        return matchesClass && !isHidden;
      });

      const totalCriteriaCount = EVALUATION_CRITERIA.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-surface-container text-center text-xs text-on-surface-variant">
            No active students found for ${selectedClass}.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((stu, idx) => {
        const studentId = stu.id || `s-${idx}`;
        const studentName = stu.name || stu.studentName || `Student ${idx + 1}`;

        return `
          <div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm border border-surface-container flex flex-col gap-3" data-student-id="${studentId}" data-student-name="${studentName}">
            <div class="flex items-center justify-between pb-2.5 border-b border-surface-container">
              <div>
                <h3 class="text-sm font-bold text-on-surface">${studentName}</h3>
              </div>
              <span id="score-${studentId}" class="text-xs font-bold text-primary bg-primary-fixed/60 px-2.5 py-1 rounded-full">
                0/${totalCriteriaCount} Criteria
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="criteria-${studentId}">
              ${EVALUATION_CRITERIA.map(c => `
                <label class="flex items-start gap-2.5 p-2 rounded-xl border border-surface-container hover:bg-surface-container-low transition-colors cursor-pointer select-none">
                  <input type="checkbox" name="crit_${studentId}_${c.key}" data-criterion="${c.key}" onchange="calcScore('${studentId}')"
                    class="mt-0.5 rounded border-outline-variant text-primary focus:ring-primary h-4 w-4">
                  <div class="min-w-0 flex-1">
                    <span class="block text-xs font-bold text-on-surface">${c.label}</span>
                    <span class="block text-[10px] text-on-surface-variant leading-tight">${c.desc}</span>
                  </div>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function calcScore(studentId) {
      const container = document.getElementById(`criteria-${studentId}`);
      if (!container) return;
      const checkboxes = container.querySelectorAll('input[type="checkbox"]');
      const checked = Array.from(checkboxes).filter(cb => cb.checked).length;
      document.getElementById(`score-${studentId}`).textContent = `${checked}/${checkboxes.length} Criteria`;
    }

    async function submitAssessment() {
      const classSelect = document.getElementById('class-select');
      const selectedClass = classSelect.value;
      const status = document.getElementById('status');
      const btnSubmit = document.getElementById('btn-submit');

      if (!selectedClass) {
        status.innerHTML = '<span class="text-secondary font-bold">Please select a class first.</span>';
        return;
      }

      const studentCards = document.querySelectorAll('#students-container > div[data-student-id]');
      if (studentCards.length === 0) {
        status.innerHTML = '<span class="text-secondary font-bold">No student records to submit.</span>';
        return;
      }

      const studentsPayload = Array.from(studentCards).map(card => {
        const studentId = card.getAttribute('data-student-id');
        const studentName = card.getAttribute('data-student-name');
        const checkboxes = card.querySelectorAll('input[type="checkbox"]');
        const criteriaResults = {};
        
        checkboxes.forEach(cb => {
          const critKey = cb.getAttribute('data-criterion');
          criteriaResults[critKey] = cb.checked;
        });

        const totalChecked = Array.from(checkboxes).filter(cb => cb.checked).length;

        return {
          id: studentId,
          name: studentName,
          score: `${totalChecked}/${checkboxes.length}`,
          evaluations: criteriaResults
        };
      });

      const payload = {
        className: selectedClass,
        timestamp: new Date().toISOString(),
        students: studentsPayload
      };

      btnSubmit.disabled = true;
      status.innerHTML = '<span class="inline-flex items-center gap-1.5 text-primary font-semibold"><span class="material-symbols-outlined text-sm animate-spin">progress_activity</span> Submitting records to Google Apps Script...</span>';

      try {
        await fetch(ASSESSMENT_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        playAudio(880, 0.2);
        status.innerHTML = '<span class="inline-flex items-center gap-1.5 text-emerald-600 font-bold"><span class="material-symbols-outlined text-sm">check_circle</span> All student records submitted successfully!</span>';
      } catch (err) {
        console.error("Submission error:", err);
        status.innerHTML = '<span class="inline-flex items-center gap-1.5 text-secondary font-bold"><span class="material-symbols-outlined text-sm">error</span> Submission failed. Please try again.</span>';
      } finally {
        btnSubmit.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchStudentList();
    });
  </script>
</body></html>
