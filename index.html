<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 420px;
      margin: 8px 0 12px 0;
      text-align: center;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    #scanner-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 320px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #1e293b;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #reader {
      width: 100%;
    }

    /* Start / Permission Prompt */
    #permissionPrompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      width: 100%;
    }
    .btn-start {
      width: 80%;
      max-width: 240px;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
      background: #38bdf8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
    .btn-start:active {
      background: #0ea5e9;
      transform: scale(0.98);
    }

    /* Big Status Overlay */
    #resultOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 50;
      text-align: center;
      transition: background 0.2s ease;
    }
    .state-waiting { background: rgba(15, 23, 42, 0.96); }
    .state-success { background: #15803d; }
    .state-failed  { background: #b91c1c; }

    .status-icon {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .status-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .status-subtitle {
      font-size: 1rem;
      font-weight: 500;
      opacity: 0.9;
      word-break: break-all;
    }

    .hidden {
      display: none !important;
    }

    /* Logs Card */
    .card {
      width: 100%;
      max-width: 420px;
      margin-top: 16px;
      padding: 14px;
      background: #1e293b;
      border-radius: 14px;
      border: 1px solid #334155;
    }
    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .history-list {
      list-style: none;
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
    }
    .history-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 68%;
    }
    .history-name {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .history-tag {
      font-family: monospace;
      color: #38bdf8;
    }
    .history-pill {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .pill-success { background: #22c55e; color: #ffffff; }
    .pill-failed { background: #ef4444; color: #ffffff; }
    .pill-wait { background: #f59e0b; color: #000000; }
  </style>
</head>
<body>

  <header>
    <h1>Scanner</h1>
  </header>

  <div id="scanner-wrapper">
    <div id="reader"></div>

    <!-- Explicit tap trigger to satisfy Android permission sandbox -->
    <div id="permissionPrompt">
      <p style="font-size: 0.95rem; margin-bottom: 14px; color: #cbd5e1;">Tap to allow camera scan</p>
      <button class="btn-start" id="startCameraBtn">ENABLE CAMERA</button>
      <p id="insecureWarning" style="color: #f87171; font-size: 0.75rem; margin-top: 14px; display: none;">
        Warning: Camera requires HTTPS. If opening from IP or file, Android will block it.
      </p>
    </div>

    <!-- Big Full Status Overlay -->
    <div id="resultOverlay" class="state-waiting hidden">
      <div id="overlayIcon" class="status-icon">⏳</div>
      <div id="overlayTitle" class="status-title">WAIT</div>
      <div id="overlayName" class="status-name"></div>
      <div id="overlayDetail" class="status-subtitle">Processing...</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header-row">
      <span>LOGS (<span id="logCount">0</span>)</span>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>
    <ul id="historyList" class="history-list">
      <li style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 12px 0;">No scans yet</li>
    </ul>
  </div>

  <script>
    const SCRIPT_BASE = "https://script.google.com/macros/s/AKfycbwCBubJiXwKVKoLAltV1VEvHcfTT0r0FbEOAyK6b6y_pHKf8HAyRQ2GnfjDqr9Kgl_g/exec";
    const DISPLAY_DURATION_MS = 2500;

    const scannerWrapper = document.getElementById("scanner-wrapper");
    const permissionPrompt = document.getElementById("permissionPrompt");
    const startCameraBtn = document.getElementById("startCameraBtn");
    const insecureWarning = document.getElementById("insecureWarning");
    const resultOverlay = document.getElementById("resultOverlay");
    const overlayIcon = document.getElementById("overlayIcon");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayName = document.getElementById("overlayName");
    const overlayDetail = document.getElementById("overlayDetail");
    const historyList = document.getElementById("historyList");
    const clearBtn = document.getElementById("clearBtn");
    const logCount = document.getElementById("logCount");

    // Check secure context
    if (window.location.protocol !== "https:" && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
      insecureWarning.style.display = "block";
    }

    const scanner = new Html5Qrcode("reader");
    let isCameraActive = false;
    let isPaused = false;
    let scanLogs = [];
    let autoResumeTimer = null;
    let activeLogId = null;

    function renderLogs() {
      logCount.innerText = scanLogs.length;
      if (scanLogs.length === 0) {
        historyList.innerHTML = `<li style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 12px 0;">No scans yet</li>`;
        return;
      }

      historyList.innerHTML = scanLogs.map(item => `
        <li class="history-item">
          <div class="history-info">
            <span class="history-name">${item.personName || "Checking..."}</span>
            <div class="history-meta">
              <span class="history-tag">${item.tagId}</span>
              <span>•</span>
              <span>${item.time}</span>
            </div>
          </div>
          <span class="history-pill pill-${item.state}">${item.statusText}</span>
        </li>
      `).join('');
    }

    function addLogEntry(tagId) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const entry = {
        id: Date.now(),
        tagId: tagId,
        personName: "",
        time: timeStr,
        state: "wait",
        statusText: "WAIT"
      };
      scanLogs.unshift(entry);
      if (scanLogs.length > 50) scanLogs.pop();
      renderLogs();
      return entry.id;
    }

    function updateLogEntry(id, isSuccess, resolvedName) {
      const item = scanLogs.find(e => e.id === id);
      if (item) {
        item.state = isSuccess ? "success" : "failed";
        item.statusText = isSuccess ? "SUCCESS" : "FAILED";
        item.personName = resolvedName || (isSuccess ? "Verified" : "Not Found");
        renderLogs();
      }
    }

    clearBtn.addEventListener("click", () => {
      scanLogs = [];
      renderLogs();
    });

    function playAudio(frequency, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function showStatus(type, nameText, detailText) {
      clearTimeout(autoResumeTimer);
      resultOverlay.className = "";

      if (type === "wait") {
        resultOverlay.classList.add("state-waiting");
        overlayIcon.innerText = "⏳";
        overlayTitle.innerText = "WAIT";
        overlayName.innerText = "";
        overlayDetail.innerText = "Contacting server...";
      } else if (type === "success") {
        resultOverlay.classList.add("state-success");
        overlayIcon.innerText = "✅";
        overlayTitle.innerText = "SUCCESS";
        overlayName.innerText = nameText || "";
        overlayDetail.innerText = detailText || "";
        playAudio(880, 0.18);

        autoResumeTimer = setTimeout(() => {
          resumeScanning();
        }, DISPLAY_DURATION_MS);
      } else {
        resultOverlay.classList.add("state-failed");
        overlayIcon.innerText = "❌";
        overlayTitle.innerText = "FAILED";
        overlayName.innerText = nameText || "";
        overlayDetail.innerText = detailText || "Failed";
        playAudio(220, 0.35);

        autoResumeTimer = setTimeout(() => {
          resumeScanning();
        }, DISPLAY_DURATION_MS);
      }

      resultOverlay.classList.remove("hidden");
    }

    async function startCameraDirectly() {
      const config = {
        fps: 15,
        qrbox: { width: 220, height: 220 },
        aspectRatio: 1.0
      };

      try {
        // Enumerate devices to force Android permission prompt
        const devices = await Html5Qrcode.getCameras();
        
        let backCameraId = null;
        if (devices && devices.length) {
          const backCam = devices.find(d => d.label.toLowerCase().includes("back") || d.label.toLowerCase().includes("rear") || d.label.toLowerCase().includes("environment"));
          backCameraId = backCam ? backCam.id : devices[devices.length - 1].id;
        }

        const cameraChoice = backCameraId ? backCameraId : { facingMode: "environment" };

        await scanner.start(
          cameraChoice,
          config,
          onScanSuccess,
          () => {}
        );

        permissionPrompt.style.display = "none";
        isCameraActive = true;
        isPaused = false;
      } catch (err) {
        permissionPrompt.innerHTML = `
          <div style="padding: 16px; color: #ef4444; font-size: 0.9rem; font-weight: 700;">
            Permission Denied or Camera Inaccessible.<br><br>
            <span style="font-weight: 400; font-size: 0.8rem; color: #cbd5e1;">
              1. Tap the lock/info icon in the browser address bar.<br>
              2. Change Camera permission to <b>Allow</b>.<br>
              3. Refresh this page.
            </span>
          </div>`;
      }
    }

    startCameraBtn.addEventListener("click", () => {
      startCameraDirectly();
    });

    // Auto-attempt start on load; if browser blocks, user clicks button
    startCameraDirectly().catch(() => {});

    function resumeScanning() {
      clearTimeout(autoResumeTimer);
      resultOverlay.classList.add("hidden");
      if (isCameraActive && isPaused) {
        try {
          scanner.resume();
          isPaused = false;
        } catch (e) {}
      }
    }

    window.handleAppsScriptResponse = function(data) {
      const isSuccess = data && (data.status === "SUCCESS" || data.result === "success" || data.success === true || !data.error);
      const personName = (typeof data === "object" && data !== null)
        ? (data.name || data.studentName || data.userName || data.fullName || "")
        : "";
      const message = typeof data === "object" ? (data.message || "") : String(data);

      showStatus(isSuccess ? "success" : "failed", personName, message);

      if (activeLogId) {
        updateLogEntry(activeLogId, isSuccess, personName);
        activeLogId = null;
      }
    };

    function sendCodeToSheet(tagId) {
      const oldScript = document.getElementById("gas-script");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "gas-script";
      script.src = `${SCRIPT_BASE}?tagId=${encodeURIComponent(tagId)}&callback=handleAppsScriptResponse`;
      
      script.onerror = function() {
        showStatus("failed", "", "Network Error");
        if (activeLogId) {
          updateLogEntry(activeLogId, false, "Connection Error");
          activeLogId = null;
        }
      };

      document.body.appendChild(script);
    }

    function onScanSuccess(decodedText) {
      if (isPaused) return;

      try {
        scanner.pause(true);
        isPaused = true;
      } catch (e) {}

      if ("vibrate" in navigator) {
        navigator.vibrate(100);
      }

      const cleanTag = decodedText.trim();
      activeLogId = addLogEntry(cleanTag);
      showStatus("wait");
      sendCodeToSheet(cleanTag);
    }
  </script>
</body>
</html>
